<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Пицца диаграмма из Google Sheets</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="font-family: sans-serif; text-align:center; margin-top:40px;">
  <h2>Визуализация данных из Google Sheets 🍕</h2>
  <canvas id="myChart" width="150" height="150"></canvas>
  
  <script>
  const SHEET_ID = '15nF9Oz9uI4aY7pf7LJ2IXmWkQrVcVVUT';
  const SHEET_NAME = 'Лист1';
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;

  async function fetchCSV(url) {
    const res = await fetch(url);
    return await res.text();
  }

  function parseCSV(data) {
    const lines = data.split('\n').filter(line => line.trim());
    const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
    const rows = lines.slice(1).map(line => {
      const values = line.split(',').map(v => v.replace(/"/g, '').trim());
      return Object.fromEntries(values.map((v, i) => [headers[i], v]));
    });
    return rows;
  }

  async function drawChart() {
    const csv = await fetchCSV(CSV_URL);
    const data = parseCSV(csv);

    // 🔹 Группируем по "name"
    const grouped = {};
    data.forEach(row => {
      const name = row.name;
      const usd = parseFloat(row.usd);
      if (!grouped[name]) grouped[name] = 0;
      grouped[name] += usd;
    });

    const labels = Object.keys(grouped);
    const values = Object.values(grouped);

    const ctx = document.getElementById('myChart').getContext('2d');
    new Chart(ctx, {
      type: 'pie',
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: [
            '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
            '#9966FF', '#FF9F40', '#E7E9ED'
          ]
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'bottom' },
          title: { display: true, text: 'Сумма по категориям (USD)' }
        }
      }
    });
  }

  drawChart();
</script>

</body>
</html>
