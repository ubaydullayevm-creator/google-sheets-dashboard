<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Интерактивная пицца-диаграмма</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f9f9f9;
      margin: 0;
      padding: 40px;
    }
    h2 {
      margin-bottom: 20px;
    }
    .chart-container {
      position: relative;
      margin: auto;
      height: 400px;
      width: 400px;
      max-width: 90vw;
      max-height: 90vh;
    }
  </style>
</head>
<body>
  <h2>Продажи по категориям 🍕</h2>
  <div class="chart-container">
    <canvas id="myChart"></canvas>
  </div>

  <script>
    const SHEET_ID = '15nF9Oz9uI4aY7pf7LJ2IXmWkQrVcVVUT';
    const SHEET_NAME = 'Лист1';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;

    async function fetchCSV(url) {
      const res = await fetch(url);
      return await res.text();
    }

    function parseCSV(data) {
      const lines = data.split('\n').filter(line => line.trim());
      const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
      const rows = lines.slice(1).map(line => {
        const values = line.split(',').map(v => v.replace(/"/g, '').trim());
        return Object.fromEntries(values.map((v, i) => [headers[i], v]));
      });
      return rows;
    }

    async function drawChart() {
      const csv = await fetchCSV(CSV_URL);
      const data = parseCSV(csv);

      // 🔹 Группируем по "name"
      const grouped = {};
      data.forEach(row => {
        const name = row.name;
        const usd = parseFloat(row.usd);
        if (!grouped[name]) grouped[name] = 0;
        grouped[name] += usd;
      });

      const labels = Object.keys(grouped);
      const values = Object.values(grouped);

      const colors = [
        '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
        '#9966FF', '#FF9F40', '#E7E9ED'
      ];

      const ctx = document.getElementById('myChart').getContext('2d');

      const chart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: colors
          }]
        },
        options: {
          maintainAspectRatio: false,
          responsive: true,
          plugins: {
            legend: { position: 'bottom' },
            title: { display: true, text: 'Интерактивная диаграмма' }
          },
          onClick: (e, elements) => {
            if (elements.length > 0) {
              const index = elements[0].index;
              toggleHighlight(index, chart);
            }
          }
        }
      });

      let selectedIndex = null;

      function toggleHighlight(index, chart) {
        const dataset = chart.data.datasets[0];
        if (selectedIndex === index) {
          // если нажали повторно — сбросить выделение
          dataset.backgroundColor = colors;
          selectedIndex = null;
        } else {
          // делаем выбранный сегмент ярким, остальные серыми
          dataset.backgroundColor = dataset.data.map((_, i) =>
            i === index ? colors[i] : 'rgba(180,180,180,0.3)'
          );
          selectedIndex = index;
        }
        chart.update();
      }
    }

    drawChart();
  </script>
</body>
</html>
