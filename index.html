<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>HR Аналитика — Этапы кандидатов</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f8fafc;
      color: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
    }

    h2 {
      font-weight: 600;
      margin-bottom: 30px;
      text-align: center;
    }

    canvas {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      display: block;
    }
  </style>
</head>
<body>
  <h2>Статистика по этапам кандидатов</h2>
  <canvas id="myChart"></canvas>

  <script>
    // 🔗 Ссылка на опубликованную Google Sheet (CSV)
    const SHEET_URL =
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vQwayAC4nqBpPb04NsR35q2BkuECXgdONmPOki6jGaudEY7LGBsCZfnJjRPzDA5qypKOcDAMzNPuC9-/pub?output=csv';

    async function fetchCSV(url) {
      const res = await fetch(url);
      const text = await res.text();
      return text;
    }

    function parseCSV(data) {
      const lines = data.split('\n').filter(line => line.trim());
      const headers = lines[0].split(',');
      return lines.slice(1).map(line => {
        const values = line.split(',');
        return Object.fromEntries(values.map((v, i) => [headers[i]?.trim(), v.trim()]));
      });
    }

    let chart; // глобальная переменная для хранения диаграммы

    async function drawChart() {
      const csv = await fetchCSV(SHEET_URL);
      const data = parseCSV(csv);

      // Подсчёт количества кандидатов по каждому этапу
      const stages = {};
      data.forEach(row => {
        const stage = row['Этап'] || 'Не указано';
        stages[stage] = (stages[stage] || 0) + 1;
      });

      const labels = Object.keys(stages);
      const values = Object.values(stages);

      const ctx = document.getElementById('myChart').getContext('2d');

      if (chart) chart.destroy(); // перерисовка при обновлении

      chart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: ['#60a5fa', '#34d399', '#fbbf24', '#f87171', '#a78bfa'],
            borderWidth: 2,
            borderColor: '#fff'
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom' },
            tooltip: { enabled: true }
          },
          onClick: (event, elements) => {
            if (elements.length > 0) {
              const index = elements[0].index;
              const dataset = chart.data.datasets[0];

              // выделение активного сегмента
              dataset.backgroundColor = dataset.backgroundColor.map((color, i) =>
                i === index ? color : '#e5e7eb'
              );

              chart.update();
            }
          }
        }
      });
    }

    drawChart();
    setInterval(drawChart, 60000); // автообновление каждые 60 секунд
  </script>
</body>
</html>
