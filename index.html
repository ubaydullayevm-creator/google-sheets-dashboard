<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Пицца диаграмма из Google Sheets</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f7f7f7;
      margin: 0;
      padding: 40px;
    }
    h2 {
      margin-bottom: 20px;
    }
    .chart-container {
      position: relative;
      margin: auto;
      height: 400px;
      width: 400px;
      max-width: 90vw;
      max-height: 90vh;
    }
  </style>
</head>
<body>
  <h2>Продажи по категориям 🍕</h2>
  <div class="chart-container">
    <canvas id="myChart"></canvas>
  </div>

  <script>
    const SHEET_ID = '15nF9Oz9uI4aY7pf7LJ2IXmWkQrVcVVUT';
    const SHEET_NAME = 'Лист1';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;

    async function fetchCSV(url) {
      const res = await fetch(url);
      return await res.text();
    }

    function parseCSV(data) {
      const lines = data.split('\n').filter(line => line.trim());
      const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
      const rows = lines.slice(1).map(line => {
        const values = line.split(',').map(v => v.replace(/"/g, '').trim());
        return Object.fromEntries(values.map((v, i) => [headers[i], v]));
      });
      return rows;
    }

    async function drawChart() {
      const csv = await fetchCSV(CSV_URL);
      const data = parseCSV(csv);

      const grouped = {};
      data.forEach(row => {
        const name = row.name;
        const usd = parseFloat(row.usd);
        if (!grouped[name]) grouped[name] = 0;
        grouped[name] += usd;
      });

      const labels = Object.keys(grouped);
      const values = Object.values(grouped);

      const ctx = document.getElementById('myChart').getContext('2d');
      new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: [
              '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
              '#9966FF', '#FF9F40', '#E7E9ED'
            ]
          }]
        },
        options: {
          maintainAspectRatio: false,
          responsive: true,
          plugins: {
            legend: { position: 'bottom' },
            title: { display: true, text: 'Сумма продаж (USD)' }
          }
        }
      });
    }

    drawChart();
  </script>
</body>
</html>
